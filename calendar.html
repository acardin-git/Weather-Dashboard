<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Averages · Weather Dashboard</title>
    <script src="theme-utils.js"></script>
    <script>
      // No-flash theme bootstrap (see calendar.js for the full logic).
      // Google Fonts are only loaded when the resolved theme is Blueprint;
      // Modern and Dark use the platform system font.
      (function () {
        var theme = "blueprint";
        try {
          var saved = localStorage.getItem("weather-dashboard-theme");
          if (saved === "blueprint" || saved === "modern" || saved === "dark") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (e) {
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "blueprint") window.loadBlueprintFonts();
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">

    <!-- ======= Header: back link + month navigation + unit toggle ======= -->
    <header class="cal-header">
      <a class="back-link" href="index.html">&#8592; Dashboard</a>

      <div class="cal-nav">
        <button type="button" id="prev-month" class="cal-nav-btn" aria-label="Previous month">&lsaquo;</button>
        <h1 id="month-title" class="cal-title">&nbsp;</h1>
        <button type="button" id="next-month" class="cal-nav-btn" aria-label="Next month">&rsaquo;</button>
      </div>

      <div class="header-controls">
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <span class="unit-pill" aria-hidden="true"></span>
          <button type="button" id="unit-c" class="unit-btn" aria-pressed="false">°C</button>
          <button type="button" id="unit-f" class="unit-btn" aria-pressed="false">°F</button>
        </div>
        <div class="theme-switcher" role="group" aria-label="Theme">
          <span class="theme-pill" aria-hidden="true"></span>
          <button type="button" class="theme-btn" data-theme-value="blueprint" aria-pressed="true">Blueprint</button>
          <button type="button" class="theme-btn" data-theme-value="modern" aria-pressed="false">Modern</button>
          <button type="button" class="theme-btn" data-theme-value="dark" aria-pressed="false">Dark</button>
        </div>
        <span class="note note--d note--toggle" aria-hidden="true">mercury scale</span>
      </div>
    </header>

    <!-- Decorative: dimension line under the plate header -->
    <div class="dim" aria-hidden="true">
      <i class="dim-end"></i><i class="dim-run l"></i>
      <span class="dim-note">five-year record &mdash; monthly survey</span>
      <i class="dim-run r"></i><i class="dim-end"></i>
    </div>

    <p id="cal-meta" class="cal-meta">&nbsp;</p>

    <!-- ======= Calendar of 5-year average highs/lows per day ======= -->
    <section class="card" aria-label="Daily historical averages">
      <div id="calendar-grid" class="calendar-grid"></div>
      <p id="cal-error" class="cal-error hidden"></p>
    </section>

    <div class="hatch" aria-hidden="true"></div>

    <footer class="app-footer">
      Historical data by
      <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
    </footer>
  </main>

  <!-- Decorative: archive stamp -->
  <div class="stamp" aria-hidden="true">
    <span class="stamp-no">Sheet &#8470; WD-26/08-B</span>
    <span class="stamp-title">Blueprint Archive</span>
    <span class="stamp-sig">records verified &mdash; o.m.</span>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
